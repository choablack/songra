<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<title>2026 송라중학교 AI·디지털 활용 선도학교 수업 사례집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700&family=Hahmlet:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --board:#ffe6e6;      /* 분홍 색지 */
  --board-deep:#ffd6d9;
  --chalk:#4a1a2a;      /* 색지 위 글씨: 짙은 자주 */
  --chalk-dim:rgba(74,26,42,.72);
  --chalk-line:rgba(74,26,42,.24);
  --marker:#ffb9c6;     /* 분홍 형광펜 */
  --accent:#b3264a;     /* 눌러지는 글자 */
  --paper:#fffafa;      /* 학습지 */
  --ink:#2a1820;        /* 먹 */
  --ink-soft:#7a5f68;
  --rule:#ecd6da;
  --pen:#b3264a;        /* 링크 */
  --display:'Hahmlet','Noto Serif KR','Noto Serif CJK KR','Nanum Myeongjo',serif;
  --body:'Gothic A1','Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--board);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.paper :focus-visible{outline-color:var(--pen)}
[hidden]{display:none !important}


/* ───────── 첫 화면: 분홍 색지 ───────── */
.board{background:var(--board);color:var(--chalk);min-height:100vh;padding:clamp(28px,5vw,64px) clamp(18px,4.5vw,64px) 56px}
.board-inner{max-width:1240px;margin:0 auto}
.masthead{display:block;background:#fadadd;box-shadow:0 0 0 100vmax #fadadd;clip-path:inset(-100vmax -100vmax 0 -100vmax);padding-bottom:clamp(20px,3vw,36px)}
.masthead .over{font-size:clamp(15px,1.5vw,18px);font-weight:500;color:var(--chalk-dim);margin:0 0 10px}
.masthead h1{font-family:var(--display);font-weight:700;font-size:clamp(44px,8.2vw,112px);line-height:1.02;letter-spacing:-.035em;margin:0}
.masthead .lede{margin:20px 0 0;font-size:clamp(15px,1.35vw,17.5px);color:var(--chalk-dim);max-width:34em}
.search{display:block}
.search span{display:block;font-size:13.5px;color:var(--chalk-dim);margin-bottom:6px}
.search input{width:100%;background:transparent;border:0;border-bottom:2px solid #966875;padding:8px 2px 9px;color:var(--chalk);font-size:17px;border-radius:0}
.search input::placeholder{color:#754453;opacity:1}
.search input:focus{outline:0;border-bottom-color:var(--accent)}

.lookup{display:block;min-width:0}
.picks{display:flex;gap:10px;margin-top:12px}
.pick{position:relative;flex:1 1 0;min-width:0;display:block}
.pick::after{content:'';position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:2px solid var(--chalk);border-bottom:2px solid var(--chalk);transform:translateY(-75%) rotate(45deg);pointer-events:none}
.pick select{width:100%;-webkit-appearance:none;appearance:none;background:transparent;border:1.5px solid #966875;border-radius:6px;color:var(--chalk);padding:7px 34px 8px 12px;font-size:15px;line-height:1.5;cursor:pointer}
.pick select:hover{border-color:var(--chalk)}
.pick select.on{border-color:var(--chalk);box-shadow:inset 0 0 0 1px var(--chalk);font-weight:700}
.pick select option{color:#2a1820;background:#fff;font-weight:400}
.finder{margin:clamp(22px,3.4vw,40px) 0 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,320px);gap:14px 40px;align-items:end}
.tools h2{font-size:14.5px;font-weight:700;margin:0 0 8px;color:var(--chalk)}
.chip.extra{display:none}
.chips.open .chip.extra{display:inline-block}
.more{background:transparent;border:0;color:var(--chalk);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 6px;font-size:14.5px}
.more:hover{color:var(--accent)}
.found{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin:18px 0 0}
.found p{margin:0;font-family:var(--display);font-weight:600;font-size:19px;color:var(--chalk)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:transparent;border:1.5px solid var(--chalk-line);color:var(--chalk);border-radius:999px;padding:4px 13px 5px;font-size:14.5px;cursor:pointer;line-height:1.5}
.chip small{font-size:12px;color:var(--chalk-dim);margin-left:5px}
.chip:hover{border-color:var(--chalk)}
.chip[aria-pressed="true"]{background:var(--chalk);border-color:var(--chalk);color:#fff;font-weight:700}
.chip[aria-pressed="true"] small{color:#fff}
.reset{background:transparent;border:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 6px;font-size:14.5px}

/* 시간표 */
.timetable{margin-top:22px;border-top:2px solid var(--chalk);border-bottom:2px solid var(--chalk)}
.tt-head,.tt-row{display:grid;grid-template-columns:92px repeat(3,minmax(0,1fr))}
.tt-head{border-bottom:1px solid var(--chalk-line)}
.tt-head div{padding:9px 14px;font-family:var(--display);font-weight:600;font-size:17px}
.tt-row{border-bottom:1px solid var(--chalk-line)}
.tt-row:last-child{border-bottom:0}
.tt-subject{padding:14px 14px 14px 2px;font-family:var(--display);font-weight:700;font-size:21px;line-height:1.35}
.tt-cell{border-left:1px solid var(--chalk-line);padding:6px;min-height:76px;display:flex;flex-direction:column;gap:6px}
.tt-cell .gradeTag{display:none}
.case-link{display:block;text-decoration:none;color:var(--chalk);padding:8px 10px 9px;border-radius:3px;transition:background-color .12s,color .12s,opacity .15s}
.case-link b{display:block;font-weight:700;font-size:16.5px;line-height:1.42}
.case-link i{display:block;font-style:normal;font-size:13.5px;color:var(--chalk-dim);margin-top:3px;line-height:1.45}
.case-link:hover,.case-link:focus-visible{background:var(--marker);color:var(--ink)}
.case-link:hover i,.case-link:focus-visible i{color:var(--ink)}
/* 찾은 수업 목록: 맞는 수업만 보여 준다 */
.results{margin-top:10px;border-top:2px solid var(--chalk);border-bottom:2px solid var(--chalk)}
.results .case-link{display:grid;grid-template-columns:104px minmax(0,1fr);column-gap:14px;padding:12px 8px 13px;border-radius:0;border-bottom:1px solid var(--chalk-line)}
.results .case-link:last-child{border-bottom:0}
.results .where{grid-row:1 / span 2;font-family:var(--display);font-weight:600;font-size:16px;line-height:1.5}
.results .case-link b,.results .case-link i{grid-column:2}
.none{margin:18px 0 0;color:var(--chalk-dim)}
.colophon{margin:34px 0 0;font-size:13.5px;color:var(--chalk-dim)}

@media (max-width:820px){
  .board{padding-top:20px}
  .masthead .over{font-size:14px;margin-bottom:4px}
  .masthead h1{font-size:clamp(34px,11.5vw,54px)}
  .masthead .lede{display:none}
  .masthead{padding-bottom:14px}
  .finder{grid-template-columns:1fr;margin-top:14px;gap:12px}
  .picks{margin-top:10px}
  .pick select{padding:6px 32px 7px 11px;font-size:14.5px}
  .tools h2{margin-bottom:6px}
  .chip{font-size:14px;padding:3px 11px 4px}
  .found{margin-top:12px}
  .found p{font-size:17px}
  .timetable{margin-top:14px}
  .results .case-link{grid-template-columns:76px minmax(0,1fr);column-gap:10px;padding:10px 4px 11px}
  .results .where{font-size:14.5px}
  .tt-head{display:none}
  .tt-row{grid-template-columns:1fr;padding:12px 0 8px}
  .tt-subject{padding:0 0 4px;font-size:19px}
  .tt-cell{border-left:0;padding:0;min-height:0}
  .tt-cell:empty{display:none}
  .case-link{display:grid;grid-template-columns:52px 1fr;column-gap:8px;padding:8px 6px}
  .tt-cell .gradeTag{display:block;grid-row:1 / span 2;font-size:13.5px;color:var(--chalk-dim);padding-top:2px}
  .case-link:hover .gradeTag{color:var(--ink)}
  .case-link b,.case-link i{grid-column:2}
}

/* ───────── 사례 화면 ───────── */
.case-top{background:var(--board);color:var(--chalk);padding:18px clamp(18px,4.5vw,64px) clamp(28px,4vw,48px)}
.case-top-inner,.case-body-inner{max-width:1080px;margin:0 auto}
.case-nav{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:14.5px;flex-wrap:wrap}
.case-nav a,.case-nav button{background:transparent;border:0;color:var(--chalk);text-decoration:none;padding:6px 2px;cursor:pointer;border-bottom:1.5px solid var(--chalk-line)}
.case-nav a:hover,.case-nav button:hover{border-bottom-color:var(--accent);color:var(--accent)}
.case-nav .pn{display:flex;gap:18px}
.case-kicker{margin:clamp(26px,4vw,46px) 0 8px;font-size:16px;color:var(--chalk-dim);font-weight:500}
.case-top h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,4.4vw,52px);line-height:1.2;letter-spacing:-.025em;margin:0;max-width:22em}
.facts{margin:clamp(22px,3vw,34px) 0 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--chalk-line)}
.facts div{padding:12px 16px 12px 0;border-bottom:1px solid var(--chalk-line)}
.facts dt{font-size:13px;color:var(--chalk-dim);margin:0 0 2px}
.facts dd{margin:0;font-size:16px;font-weight:500;line-height:1.5}
.facts .wide{grid-column:1 / -1}
.facts .two{grid-column:span 2}
.shortcuts{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0;padding:0;list-style:none}
.shortcuts a{display:inline-block;border:1.5px solid var(--chalk);color:var(--chalk);border-radius:999px;padding:5px 15px 6px;font-size:15px;font-weight:700;text-decoration:none;line-height:1.4}
.shortcuts a:hover,.shortcuts a:focus-visible{background:var(--chalk);color:#fff}
.ops{list-style:none;margin:0;padding:0}
.ops li + li{margin-top:4px}
.ops em{font-style:normal;color:var(--chalk-dim);margin-right:8px}

.paper{background:var(--paper);min-height:60vh}
.jump{position:sticky;top:0;z-index:5;background:rgba(255,250,250,.96);border-bottom:1px solid var(--rule);padding:0 clamp(18px,4.5vw,64px)}
.jump div{max-width:1080px;margin:0 auto;display:flex;gap:4px 20px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.jump a{font-size:14.5px;color:var(--ink-soft);text-decoration:none;padding:11px 0 10px;border-bottom:2px solid transparent}
.jump a:hover{color:var(--ink);border-bottom-color:var(--ink)}
.case-body{padding:clamp(22px,4vw,48px) clamp(18px,4.5vw,64px) 72px}
.sec{display:grid;grid-template-columns:168px minmax(0,1fr);gap:8px 36px;padding:26px 0;border-bottom:1px solid var(--rule);scroll-margin-top:52px}
.sec:first-child{padding-top:6px}
.sec h2{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.4;margin:0}
.sec h2 span{background:linear-gradient(transparent 56%,var(--marker) 56%);padding:0 2px}
.prose{max-width:44em}
.prose p{margin:0 0 .8em;font-size:16.5px;line-height:1.78}
.prose p:last-child{margin-bottom:0}
.prose p.b{display:grid;grid-template-columns:1.25em 1fr}
.prose p.b > .mk{color:var(--ink-soft)}
.prose p.sub{font-family:var(--display);font-weight:600;font-size:16.5px;margin-top:1.2em}
.prose p.sub:first-child{margin-top:0}
.prose strong{font-weight:700}
.prose a{color:var(--pen)}
.inline-img{display:block;margin:6px 0 14px;max-width:min(100%,420px)}
.inline-img img{width:100%;height:auto;display:block;border:1px solid var(--rule)}

.sec.gal{grid-template-columns:1fr;gap:16px}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:26px 20px;align-items:start}
.fig{margin:0}
.fig.wide{grid-column:span 2}
.fig .imgs{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.shot{display:block;padding:0;border:1px solid var(--rule);background:#fff;cursor:zoom-in;width:100%}
.shot img{display:block;width:100%;height:auto}
.shot:hover{border-color:var(--ink)}
.fig figcaption{font-size:14.5px;line-height:1.55;color:var(--ink-soft);margin-top:7px}
.fig figcaption a{color:var(--pen);font-weight:700;white-space:nowrap;margin-left:6px}
.imgfail{display:flex;align-items:center;justify-content:center;min-height:120px;padding:14px;font-size:13.5px;color:var(--ink-soft);text-align:center}
.case-end{display:flex;justify-content:space-between;gap:16px;margin-top:34px;flex-wrap:wrap}
.case-end a{color:var(--ink);text-decoration:none;border-bottom:1.5px solid var(--ink);padding-bottom:2px;font-weight:700;max-width:46%}
.case-end a small{display:block;font-weight:400;color:var(--ink-soft);font-size:13.5px}
.case-end a:hover{color:var(--pen);border-bottom-color:var(--pen)}

@media (max-width:760px){
  .facts{grid-template-columns:1fr 1fr}
  .facts .two,.facts .unit{grid-column:1 / -1}
  .sec{grid-template-columns:1fr;padding:22px 0}
  .fig.wide{grid-column:auto}
  .figs{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px 12px}
}
@media (max-width:520px){
  .figs{grid-template-columns:1fr}
}

/* 사진 크게 보기 */
dialog.zoom{border:0;padding:0;background:transparent;max-width:100vw;max-height:100vh;width:100vw;height:100vh;color:#fff4f5}
dialog.zoom::backdrop{background:rgba(32,13,20,.94)}
.zoom-wrap{display:grid;grid-template-rows:auto 1fr auto;height:100%;padding:12px 16px 16px;gap:10px}
.zoom-bar{display:flex;justify-content:space-between;align-items:center;font-size:14.5px}
.zoom-bar button,.zoom-step button{background:transparent;border:1.5px solid rgba(255,244,245,.34);color:#fff4f5;border-radius:999px;padding:5px 15px;cursor:pointer}
.zoom-bar button:hover,.zoom-step button:hover{border-color:var(--marker);color:var(--marker)}
.zoom-stage{min-height:0;display:flex;align-items:center;justify-content:center}
.zoom-stage img{max-width:100%;max-height:100%;object-fit:contain;background:#fff}
.zoom-foot{display:flex;justify-content:space-between;align-items:center;gap:14px}
.zoom-foot p{margin:0;font-size:15px;line-height:1.5;flex:1;text-align:center}
.zoom-step{display:flex;gap:8px}
@media (prefers-reduced-motion:reduce){*{transition:none !important;scroll-behavior:auto !important}}
</style>
</head>
<body>
<!-- 첫 화면 -->
<main id="view-index" class="board">
  <div class="board-inner">
    <header class="masthead">
      <p class="over" id="over"></p>
      <h1>수업 사례집</h1>
      <p class="lede" id="lede"></p>
    </header>

    <div class="finder">
      <section class="tools" aria-label="도구로 찾기">
        <h2>도구로 찾기</h2>
        <div class="chips" id="chips"></div>
      </section>
      <div class="lookup">
        <label class="search">
          <span>수업 주제나 도구 이름으로 찾기</span>
          <input id="q" type="search" placeholder="예: 스노클, 방탈출, 논술" autocomplete="off">
        </label>
        <div class="picks">
          <span class="pick"><select id="f-subject" aria-label="교과 고르기"><option value="">교과 전체</option></select></span>
          <span class="pick"><select id="f-grade" aria-label="학년 고르기"><option value="">학년 전체</option></select></span>
        </div>
      </div>
    </div>

    <div class="found" id="found" hidden>
      <p id="status" aria-live="polite"></p>
      <button class="reset" id="reset" type="button">전체 보기</button>
    </div>
    <nav class="results" id="results" aria-label="찾은 수업" hidden></nav>
    <p class="none" id="none" hidden>맞는 수업이 없습니다. 조건을 바꾸거나 전체 보기를 눌러 주세요.</p>
    <section class="timetable" id="timetable" aria-label="교과와 학년으로 찾기"></section>
    <p class="colophon" id="colophon"></p>
  </div>
</main>

<!-- 사례 화면 -->
<div id="view-case" hidden>
  <header class="case-top">
    <div class="case-top-inner">
      <nav class="case-nav" aria-label="사례 이동">
        <a href="#" id="back">사례 목록으로</a>
        <span class="pn"><a id="prev" href="#">이전 사례</a><a id="next" href="#">다음 사례</a></span>
      </nav>
      <p class="case-kicker" id="c-kicker"></p>
      <h1 id="c-title"></h1>
      <ul class="shortcuts" id="c-short" aria-label="사진으로 바로 가기"></ul>
      <dl class="facts" id="c-facts"></dl>
    </div>
  </header>
  <div class="paper">
    <nav class="jump" aria-label="이 사례 안에서 이동"><div id="c-jump"></div></nav>
    <article class="case-body"><div class="case-body-inner" id="c-body"></div></article>
  </div>
</div>

<dialog class="zoom" id="zoom" aria-label="사진 크게 보기">
  <div class="zoom-wrap">
    <div class="zoom-bar"><span id="z-count"></span><button type="button" id="z-close">닫기</button></div>
    <div class="zoom-stage"><img id="z-img" alt=""></div>
    <div class="zoom-foot">
      <span class="zoom-step"><button type="button" id="z-prev">이전 사진</button></span>
      <p id="z-cap"></p>
      <span class="zoom-step"><button type="button" id="z-next">다음 사진</button></span>
    </div>
  </div>
</dialog>

<script src="data.js"></script>
<script>
(function(){
  var DATA = window.CASEBOOK;
  var CASES = DATA.cases;
  var SUBJECTS = ['국어','도덕','사회','수학','과학','기술','가정','정보','체육','음악','미술','영어','진로'];
  var state = { tool: null, q: '', subject: '', grade: '' };
  var byId = {};
  CASES.forEach(function(c){ byId[c.id] = c; });

  function $(id){ return document.getElementById(id); }
  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function imgUrl(src){
    if (DATA.imgMap && DATA.imgMap[src]) return DATA.imgMap[src];
    return DATA.imgBase + encodeURIComponent(src);
  }
  function caseHash(c){ return '#c/' + encodeURIComponent(c.id); }

  /* ───────── 첫 화면 ───────── */
  function buildIndex(){
    $('over').textContent = DATA.year + ' ' + DATA.school + ' ' + DATA.program;
    var subjN = {};
    CASES.forEach(function(c){ subjN[c.subject] = 1; });
    $('lede').textContent = '교과 ' + Object.keys(subjN).length + '개, 수업 ' + CASES.length +
      '편을 모았습니다. 교과와 학년이 만나는 칸에서 수업을 고르면 사례가 열립니다.';
    $('colophon').textContent = DATA.year + ' ' + DATA.school + ' ' + DATA.program + ' 운영 결과를 선생님들이 직접 정리했습니다.';
    // 도구 칩
    var count = {};
    CASES.forEach(function(c){ c.tools.forEach(function(t){ count[t] = (count[t] || 0) + 1; }); });
    var tools = Object.keys(count).sort(function(a, b){ return count[b] - count[a] || a.localeCompare(b, 'ko'); });
    var chips = $('chips');
    var TOP = 6;   // 자주 쓴 도구만 먼저 보이고 나머지는 '도구 더 보기'로 편다
    tools.forEach(function(t, ti){
      var b = el('button', 'chip' + (ti >= TOP ? ' extra' : ''));
      b.type = 'button';
      b.setAttribute('aria-pressed', 'false');
      b.dataset.tool = t;
      b.appendChild(document.createTextNode(t));
      b.appendChild(el('small', null, String(count[t])));
      b.addEventListener('click', function(){
        state.tool = (state.tool === t) ? null : t;
        applyFilter();
      });
      chips.appendChild(b);
    });
    if (tools.length > TOP) {
      var more = el('button', 'more', '도구 더 보기');
      more.type = 'button';
      more.id = 'more';
      more.setAttribute('aria-expanded', 'false');
      more.addEventListener('click', function(){
        var open = !chips.classList.contains('open');
        chips.classList.toggle('open', open);
        more.setAttribute('aria-expanded', String(open));
        more.textContent = open ? '도구 접기' : '도구 더 보기';
      });
      chips.appendChild(more);
    }

    // 시간표
    var tt = $('timetable');
    var head = el('div', 'tt-head');
    head.appendChild(el('div', null, ''));
    [1, 2, 3].forEach(function(g){ head.appendChild(el('div', null, g + '학년')); });
    tt.appendChild(head);
    SUBJECTS.forEach(function(s){
      var list = CASES.filter(function(c){ return c.subject === s; });
      if (!list.length) return;
      var row = el('div', 'tt-row');
      row.dataset.subject = s;
      row.appendChild(el('div', 'tt-subject', s));
      [1, 2, 3].forEach(function(g){
        var cell = el('div', 'tt-cell');
        list.filter(function(c){ return c.grade === g; }).forEach(function(c){
          var a = el('a', 'case-link');
          a.href = caseHash(c);
          a.dataset.id = c.id;
          a.appendChild(el('span', 'gradeTag', g + '학년'));
          a.appendChild(el('b', null, c.title));
          a.appendChild(el('i', null, c.tools.join(', ')));
          a.setAttribute('aria-label', g + '학년 ' + s + ', ' + c.title + ', ' + c.tools.join(', '));
          cell.appendChild(a);
        });
        row.appendChild(cell);
      });
      tt.appendChild(row);
    });

    $('q').addEventListener('input', function(e){ state.q = e.target.value.trim(); applyFilter(); });
    // [v3] 교과·학년 선택 상자: 사례가 있는 교과와 학년만 넣는다
    var fs = $('f-subject'), fg = $('f-grade');
    SUBJECTS.forEach(function(s){
      var n = CASES.filter(function(c){ return c.subject === s; }).length;
      if (!n) return;
      var o = el('option', null, s + ' ' + n + '편'); o.value = s; fs.appendChild(o);
    });
    [1, 2, 3].forEach(function(g){
      var n = CASES.filter(function(c){ return c.grade === g; }).length;
      if (!n) return;
      var o = el('option', null, g + '학년 ' + n + '편'); o.value = String(g); fg.appendChild(o);
    });
    fs.addEventListener('change', function(){ state.subject = fs.value; applyFilter(); });
    fg.addEventListener('change', function(){ state.grade = fg.value; applyFilter(); });
    $('reset').addEventListener('click', function(){
      state.tool = null; state.q = ''; state.subject = ''; state.grade = '';
      $('q').value = ''; fs.value = ''; fg.value = ''; applyFilter();
    });
  }

  function haystack(c){
    if (!c._h) {
      c._h = [c.title, c.subject, c.grade + '학년', c.toolsRaw, c.tools.join(' '), c.unit.join(' ')]
        .join(' ').toLowerCase().replace(/\s+/g, '');
    }
    return c._h;
  }
  function matches(c){
    if (state.tool && c.tools.indexOf(state.tool) < 0) return false;
    if (state.subject && c.subject !== state.subject) return false;
    if (state.grade && String(c.grade) !== state.grade) return false;
    if (state.q) {
      var words = state.q.toLowerCase().split(/\s+/);
      var h = haystack(c);
      for (var i = 0; i < words.length; i++) if (h.indexOf(words[i]) < 0) return false;
    }
    return true;
  }
  function applyFilter(){
    var active = !!(state.tool || state.q || state.subject || state.grade);
    var list = active ? CASES.filter(matches) : [];
    var res = $('results');
    res.replaceChildren();
    list.forEach(function(c){
      var a = el('a', 'case-link');
      a.href = caseHash(c);
      a.appendChild(el('span', 'where', c.grade + '학년 ' + c.subject));
      a.appendChild(el('b', null, c.title));
      a.appendChild(el('i', null, c.tools.join(', ')));
      a.setAttribute('aria-label', c.grade + '학년 ' + c.subject + ', ' + c.title + ', ' + c.tools.join(', '));
      res.appendChild(a);
    });
    // 찾는 중에는 맞는 수업만 목록으로 보여 주고 시간표는 숨긴다
    $('timetable').hidden = active;
    res.hidden = !(active && list.length > 0);
    $('none').hidden = !(active && list.length === 0);
    $('found').hidden = !active;
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function(b){
      b.setAttribute('aria-pressed', String(b.dataset.tool === state.tool));
    });
    $('f-subject').classList.toggle('on', !!state.subject);
    $('f-grade').classList.toggle('on', !!state.grade);
    var label = [];
    var who = [state.grade ? state.grade + '학년' : '', state.subject].filter(Boolean).join(' ');
    if (who) label.push(who);
    if (state.tool) label.push(state.tool);
    if (state.q) label.push('‘' + state.q + '’');
    $('status').textContent = active ? (label.join(', ') + ' 수업 ' + list.length + '편') : '';
  }

  /* ───────── 사례 화면 ───────── */
  var MARK = /^(◦|○|●|•|·|ㆍ|-|–|—|▪|■|□|▶|▷|※|\*)\s*/;
  var LABEL = /^([^:：]{2,26})[:：]\s+(?=\S)/;
  var URLISH = /(https?:\/\/[^\s)]+|joo\.is\/[^\s)]+)/g;

  function richText(parent, text){
    // 링크만 걸고 나머지는 선생님이 쓴 글 그대로 둔다
    var last = 0, m;
    URLISH.lastIndex = 0;
    while ((m = URLISH.exec(text))) {
      if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
      var a = el('a', null, m[0]);
      a.href = (m[0].indexOf('http') === 0 ? '' : 'https:' + String.fromCharCode(47, 47)) + m[0];
      a.target = '_blank'; a.rel = 'noopener';
      parent.appendChild(a);
      last = m.index + m[0].length;
    }
    if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
  }
  function lineInto(parent, text, allowLabel){
    var m = allowLabel && text.match(LABEL);
    if (m && !/[.!?。]/.test(m[1])) {
      parent.appendChild(el('strong', null, m[1]));
      parent.appendChild(document.createTextNode(': '));
      richText(parent, text.slice(m[0].length));
    } else {
      richText(parent, text);
    }
  }
  function paragraph(block){
    var lines = block.lines.slice();
    var first = lines[0];
    var mk = first.match(MARK);
    var isSub = !mk && lines.length === 1 && /^(<.+>|\[.+\]|\d+[.)]\s?[^.]{2,30})$/.test(first) && first.length <= 34;
    var p = el('p');
    var body = p;
    if (mk) {
      p.className = 'b';
      p.appendChild(el('span', 'mk', mk[1] === '-' ? '–' : mk[1]));
      body = el('span');
      p.appendChild(body);
      first = first.slice(mk[0].length);
    } else if (isSub) {
      p.className = 'sub';
    }
    if (lines.length > 1 && first.length <= 30 && !/[.:：]$/.test(first)) {
      body.appendChild(el('strong', null, first));
    } else {
      lineInto(body, first, true);
    }
    for (var i = 1; i < lines.length; i++) {
      body.appendChild(el('br'));
      lineInto(body, lines[i], false);
    }
    return p;
  }

  var shots = [];
  function shotButton(img, caption){
    var b = el('button', 'shot');
    b.type = 'button';
    var im = el('img');
    im.loading = 'lazy';
    im.decoding = 'async';
    im.width = img.w; im.height = img.h;
    im.alt = caption || '수업 사진';
    im.src = imgUrl(img.src);
    im.addEventListener('error', function(){
      b.replaceChildren(el('span', 'imgfail', '사진을 불러오지 못했습니다 (' + img.src + ')'));
      b.disabled = true;
    });
    b.appendChild(im);
    var idx = shots.length;
    shots.push({ src: img.src, caption: caption || '' });
    b.addEventListener('click', function(){ openZoom(idx); });
    return b;
  }

  function showCase(c){
    shots = [];
    document.title = c.grade + '학년 ' + c.subject + ' ' + c.title + ' | 수업 사례집';
    $('c-kicker').textContent = c.grade + '학년 ' + c.subject;
    $('c-title').textContent = c.title;

    var facts = $('c-facts');
    facts.replaceChildren();
    function fact(dt, dd, cls){
      var d = el('div', cls || null);
      d.appendChild(el('dt', null, dt));
      var v = el('dd');
      if (typeof dd === 'string') v.textContent = dd; else v.appendChild(dd);
      d.appendChild(v);
      facts.appendChild(d);
    }
    fact('단원(주제)', c.unit.join(' / '), 'unit');
    fact('AI·디지털 도구', c.toolsRaw, 'two');
    if (c.ops.length === 1) {
      fact('실시 일자', c.ops[0].date);
      fact('수업 대상', c.ops[0].target);
      fact('참여 인원', /명/.test(c.ops[0].count) ? c.ops[0].count : c.ops[0].count + '명');
    } else {
      var ul = el('ul', 'ops');
      c.ops.forEach(function(o){
        var li = el('li');
        li.appendChild(el('em', null, o.date));
        li.appendChild(document.createTextNode(o.topic + ' (' + o.target + ', ' + (/명/.test(o.count) ? o.count : o.count + '명') + ')'));
        ul.appendChild(li);
      });
      fact('실시 일자와 수업 주제', ul, 'wide');
    }

    var body = $('c-body');
    var jump = $('c-jump');
    var short = $('c-short');
    body.replaceChildren(); jump.replaceChildren(); short.replaceChildren();
    function section(id, label, cls){
      var s = el('section', 'sec' + (cls ? ' ' + cls : ''));
      s.id = id;
      var h = el('h2');
      h.appendChild(el('span', null, label));
      s.appendChild(h);
      body.appendChild(s);
      var a = el('a', null, label);
      a.href = '#' + id;
      a.addEventListener('click', function(e){
        e.preventDefault();
        s.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      jump.appendChild(a);
      return s;
    }
    c.sections.forEach(function(sec){
      if (!sec.blocks.length) return;
      var s = section('s-' + sec.key, sec.label);
      var prose = el('div', 'prose');
      sec.blocks.forEach(function(b){
        if (b.t === 'p') prose.appendChild(paragraph(b));
        else {
          var w = el('div', 'inline-img');
          w.appendChild(shotButton(b, sec.label));
          prose.appendChild(w);
        }
      });
      s.appendChild(prose);
    });
    c.gallery.forEach(function(g, gi){
      var s = section('g-' + gi, g.group, 'gal');
      // 제목 바로 아래의 사진 바로가기
      var count = g.figs.reduce(function(n, f){ return n + f.imgs.length; }, 0);
      var li = el('li');
      var go = el('a', null, g.group + ' ' + count + '장');
      go.href = '#g-' + gi;
      go.addEventListener('click', function(e){
        e.preventDefault();
        s.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      li.appendChild(go);
      short.appendChild(li);
      var figs = el('div', 'figs');
      g.figs.forEach(function(f){
        var fig = el('figure', 'fig');
        var ratio = f.imgs.length === 1 ? f.imgs[0].w / f.imgs[0].h : 0;
        if (f.imgs.length > 1 || ratio > 2.3) fig.classList.add('wide');
        var box = el('div', 'imgs');
        f.imgs.forEach(function(im){ box.appendChild(shotButton(im, f.caption)); });
        fig.appendChild(box);
        if (f.caption || f.link) {
          var cap = el('figcaption', null, f.caption || '');
          if (f.link) {
            var a = el('a', null, '작품 열기');
            a.href = f.link; a.target = '_blank'; a.rel = 'noopener';
            cap.appendChild(a);
          }
          fig.appendChild(cap);
        }
        figs.appendChild(fig);
      });
      s.appendChild(figs);
    });

    // 이전·다음
    var i = CASES.indexOf(c);
    var p = CASES[(i - 1 + CASES.length) % CASES.length];
    var n = CASES[(i + 1) % CASES.length];
    $('prev').href = caseHash(p);
    $('next').href = caseHash(n);
    var end = el('nav', 'case-end');
    end.setAttribute('aria-label', '이전·다음 사례');
    [[p, '이전 사례'], [n, '다음 사례']].forEach(function(x){
      var a = el('a');
      a.href = caseHash(x[0]);
      a.appendChild(el('small', null, x[1] + ', ' + x[0].grade + '학년 ' + x[0].subject));
      a.appendChild(document.createTextNode(x[0].title));
      end.appendChild(a);
    });
    body.appendChild(end);
  }

  /* ───────── 사진 크게 보기 ───────── */
  var zi = 0;
  function renderZoom(){
    var s = shots[zi];
    $('z-img').src = imgUrl(s.src);
    $('z-img').alt = s.caption || '수업 사진';
    $('z-cap').textContent = s.caption;
    $('z-count').textContent = (zi + 1) + ' / ' + shots.length;
  }
  function openZoom(i){
    zi = i; renderZoom();
    var d = $('zoom');
    if (d.showModal) d.showModal(); else d.setAttribute('open', '');
  }
  function stepZoom(k){ zi = (zi + k + shots.length) % shots.length; renderZoom(); }
  function bindZoom(){
    var d = $('zoom');
    $('z-close').addEventListener('click', function(){ d.close(); });
    $('z-prev').addEventListener('click', function(){ stepZoom(-1); });
    $('z-next').addEventListener('click', function(){ stepZoom(1); });
    d.addEventListener('click', function(e){ if (e.target === d || e.target.className === 'zoom-stage') d.close(); });
    d.addEventListener('keydown', function(e){
      if (e.key === 'ArrowLeft') stepZoom(-1);
      if (e.key === 'ArrowRight') stepZoom(1);
    });
  }

  /* ───────── 화면 전환 ───────── */
  var indexScroll = 0;
  function route(){
    var h = location.hash || '';
    var m = h.match(/^#c\/(.+)$/);
    var c = null;
    if (m) { try { c = byId[decodeURIComponent(m[1])]; } catch (e) { c = null; } }
    var zoom = $('zoom');
    if (zoom.open) zoom.close();
    if (c) {
      if (!$('view-index').hidden) indexScroll = window.scrollY;
      $('view-index').hidden = true;
      $('view-case').hidden = false;
      showCase(c);
      window.scrollTo(0, 0);
    } else {
      $('view-case').hidden = true;
      $('view-index').hidden = false;
      document.title = DATA.year + ' ' + DATA.school + ' ' + DATA.program + ' 수업 사례집';
      window.scrollTo(0, indexScroll);
    }
  }

  function start(){
    buildIndex();
    applyFilter();
    bindZoom();
    $('back').addEventListener('click', function(e){ e.preventDefault(); location.hash = ''; });
    window.addEventListener('hashchange', route);
    route();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
</body>
